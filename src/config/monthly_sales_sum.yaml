table_name: monthly_sales_sum
input_csv: data/raw/GO_test_5m.csv
output_parquet: data/processed/monthly_sales_sum.parquet
output_arrow: data/processed/monthly_sales_sum.arrow
name: "Monthly Sales Sum"
columns:
  - name: transaction_date
    type: string
  - name: total_price
    type: float
    aggregate: sum
sort_by:
  column: total_price
  order: desc
api_endpoint: /api/monthly-sales-sum
url_endpoint: /monthly-sales-sum
view:
  type: "line_chart"
  title: "Monthly Sales Trend"
  x_axis: "transaction_date"
  y_axis: "total_price"
  description: "Sales trend over time"