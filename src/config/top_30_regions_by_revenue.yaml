table_name: top_30_regions_by_revenue
name: "Top 30 Regions by Revenue"
input_csv: data/raw/GO_test_5m.csv
output_parquet: data/processed/top_30_regions_by_revenue.parquet
output_arrow: data/processed/top_30_regions_by_revenue.arrow
columns:
  - name: region
    type: string
  - name: total_price
    type: float
    aggregate: sum
  - name: quantity
    type: int
    aggregate: sum
sort_by:
  column: total_price
  order: desc
limit: 30
api_endpoint: /api/top-30-regions-by-revenue
url_endpoint: /top-30-regions-by-revenue
view:
  type: "pie_chart"
  title: "Revenue Distribution by Region"
  x_axis: "region"
  y_axis: "total_price"
  description: "Regional revenue distribution"