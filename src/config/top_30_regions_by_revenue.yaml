table_name: top_30_regions_by_revenue
input_csv: data/raw/GO_test_5m.csv
output_parquet: data/processed/top_30_regions_by_revenue.parquet
output_arrow: data/processed/top_30_regions_by_revenue.arrow
columns:
  - name: region
    type: string
  - name: total_price
    type: float
    aggregate: sum
  - name: quantity
    type: int
    aggregate: sum
sort_by:
  column: total_price
  order: desc
limit: 30
url_endpoint: /api/top-30-regions-by-revenue 