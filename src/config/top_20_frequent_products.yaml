table_name: top_20_frequent_products
input_csv: data/raw/GO_test_5m.csv
output_parquet: data/processed/top_20_frequent_products.parquet
output_arrow: data/processed/top_20_frequent_products.arrow
name: "Top 20 Frequent Products"
columns:
  - name: product_name
    type: string
  - name: quantity
    type: int
    aggregate: sum
  - name: stock_quantity
    type: int
sort_by:
  column: quantity
  order: desc
limit: 20
api_endpoint: /api/top-20-frequent-products
url_endpoint: /top-20-frequent-products
view:
  type: "bar_chart"
  title: "Top 20 Most Frequent Products"
  x_axis: "product_name"
  y_axis: "quantity"
  description: "Product popularity by quantity sold"